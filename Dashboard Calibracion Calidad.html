  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

;\n  --primary-800:  var(--brand-800);\n  --primary-700:  var(--brand-700);\n  --primary-600:  var(--brand-600);\n  --primary-500:  var(--brand-500);\n  --primary-400:  var(--brand-400);\n  --primary-300:  var(--brand-300);\n  --primary-200:  var(--brand-200);\n  --primary-100:  var(--brand-100);\n\n  /* --------------  SECONDARY / VIOLET  -------------- */\n  --secondary-900: #2E1452;\n  --secondary-800: #441B7E;\n  --secondary-700: #5A1FAD;\n  --secondary-600: #7126D9;\n  --secondary-500: #8B47EB;\n  --secondary-400: #A772F4;   /* interpolated — PDF duplicated 300 */\n  --secondary-300: #C49CFC;\n  --secondary-200: #E1CDFE;\n  --secondary-100: #F0E5FF;\n\n  /* --------------  INFORMATION / BLUE  -------------- */\n  --info-900: #043762;\n  --info-800: #075392;\n  --info-700: #126FBA;\n  --info-600: #1492EB;\n  --info-500: #34ADFE;\n  --info-400: #67BFFE;\n  --info-300: #9CD4FC;\n  --info-200: #CCEAFF;\n  --info-100: #E5F5FF;\n\n  /* --------------  SUCCESS / GREEN  -------------- */\n  --success-900: #0F5733;\n  --success-800: #17834D;\n  --success-700: #24A866;\n  --success-600: #2DD280;\n  --success-500: #55DD99;\n  --success-400: #7CE9B2;\n  --success-300: #A4F4CC;\n  --success-200: #D2F9E5;\n  --success-100: #EAFBF2;\n\n  /* --------------  WARNING / ORANGE  -------------- */\n  --warning-900: #663700;\n  --warning-800: #985101;\n  --warning-700: #CB6C01;\n  --warning-600: #F2870D;\n  --warning-500: #F5993D;\n  --warning-400: #FFC166;\n  --warning-300: #FFD699;\n  --warning-200: #FFEACC;\n  --warning-100: #FFF5E5;\n\n  /* --------------  ERROR / RED  -------------- */\n  --error-900: #570F10;\n  --error-800: #821719;\n  --error-700: #AD1F21;\n  --error-600: #D92629;\n  --error-500: #EB474A;\n  --error-400: #FC696A;\n  --error-300: #F5A9A3;\n  --error-200: #FAD4D1;\n  --error-100: #FDECEA;\n\n  /* --------------  PINK / MAGENTA  --------------\n     Labeled \"Undefined\" in the palette PDF. Use sparingly\n     for promo / Club-Cashea adjacent surfaces. */\n  --pink-900: #570F3F;\n  --pink-800: #82175E;\n  --pink-700: #B01C7F;\n  --pink-600: #D9269D;\n  --pink-500: #EB47B4;\n  --pink-400: #F76EC9;\n  --pink-300: #F5A3DA;\n  --pink-200: #FAD1EC;\n  --pink-100: #FEE7F6;\n\n  /* --------------  TEAL  --------------\n     Second \"Undefined\" palette in the PDF — a true teal.\n     Use for La Cotidiana-adjacent surfaces or fresh accents.\n     900/800/700 interpolated (PDF rows were truncated). */\n  --teal-900: #004F4A;\n  --teal-800: #006B65;\n  --teal-700: #008A82;\n  --teal-600: #00C2B8;\n  --teal-500: #25D3CA;\n  --teal-400: #54DED4;\n  --teal-300: #80E4DC;\n  --teal-200: #BBF1EC;\n  --teal-100: #E0FBF9;\n\n  /* ============================================================\n     SEMANTIC TOKENS — use these in product code\n     ============================================================ */\n  --fg-1: var(--neutral-1000);        /* primary text on light */\n  --fg-2: var(--neutral-700);         /* secondary text */\n  --fg-3: var(--neutral-500);         /* tertiary / helper */\n  --fg-inverse: var(--cashea-white);\n\n  --bg-1: var(--cashea-white);        /* page */\n  --bg-2: var(--neutral-100);         /* subtle surface */\n  --bg-3: var(--neutral-200);         /* card / chip */\n  --bg-inverse: var(--cashea-ink);    /* dark surface */\n\n  --border-1: var(--neutral-200);\n  --border-2: var(--neutral-300);\n  --border-strong: var(--neutral-1000);\n\n  --accent: var(--cashea-yellow);     /* primary CTA bg — #FFEE33 */\n  --accent-ink: var(--cashea-ink);    /* text on yellow — always dark */\n  --accent-hover: var(--brand-600);   /* press/hover step — #FFDD00 */\n\n  --link: var(--info-700);\n  --success: var(--success-700);\n  --warning: var(--warning-600);\n  --error: var(--error-700);\n\n  /* ============================================================\n     RADII / SHADOWS / SPACING\n     ============================================================ */\n  --radius-xs: 4px;\n  --radius-sm: 8px;\n  --radius-md: 12px;\n  -- nt-display);\n  font-weight: var(--w-bold);\n  line-height: var(--lh-heading);\n  letter-spacing: -0.01em;\n  color: var(--fg-1);\n  margin: 0;\n}\n.display-1 { font-size: var(--fs-display-1); line-height: var(--lh-display); font-weight: var(--w-extrabold); letter-spacing: -0.02em; }\n.display-2 { font-size: var(--fs-display-2); line-height: var(--lh-display); font-weight: var(--w-extrabold); letter-spacing: -0.02em; }\n.display-3 { font-size: var(--fs-display-3); line-height: var(--lh-display); font-weight: var(--w-bold); letter-spacing: -0.02em; }\n.display-4 { font-size: var(--fs-display-4); line-height: var(--lh-display); font-weight: var(--w-bold); }\n.h1 { font-size: var(--fs-h1); }\n.h2 { font-size: var(--fs-h2); }\n.h3 { font-size: var(--fs-h3); }\n.h4 { font-size: var(--fs-h4); }\n.h5 { font-size: var(--fs-h5); }\n.h6 { font-size: var(--fs-h6); }\n\n.subtitle {\n  font-family: var(--font-body);\n  font-weight: var(--w-bold);\n  font-size: var(--fs-subtitle);\n  line-height: var(--lh-ui);\n  color: var(--fg-1);\n}\n.body-md {\n  font-family: var(--font-body);\n  font-weight: var(--w-regular);\n  font-size: var(--fs-body-md);\n  line-height: var(--lh-body);\n  color: var(--fg-1);\n}\n.body-sm {\n  font-family: var(--font-body);\n  font-weight: var(--w-regular);\n  font-size: var(--fs-body-sm);\n  line-height: var(--lh-body);\n  color: var(--fg-2);\n}\n.caption {\n  font-family: var(--font-body);\n  font-weight: var(--w-medium);\n  font-size: var(--fs-caption);\n  line-height: var(--lh-ui);\n  color: var(--fg-3);\n  letter-spacing: 0.01em;\n}\n\n/* reset */\nhtml, body { background: var(--bg-1); color: var(--fg-1); font-family: var(--font-body); }\n<\u002Fstyle>\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <style>/* latin-ext */\n@font-face {\n  font-family: 'DM Sans';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"a9320c6b-d556-40cf-8c93-9b6dcf3676b0\") format('woff2');\n  unicode-range: U+0100-02BA, amily: 'Poppins';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"122ad5ca-138b-42da-a61b-9038786226bc\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n  <style>\n    @keyframes qc-fade { from { opacity:0; transform:translateY(6px);} to { opacity:1; transform:translateY(0);} }\n    body { margin:0; }\n    * { box-sizing:border-box; }\n    input, select, button { font-family:\"DM Sans\",sans-serif; }\n    a { color:var(--brand-700); }\n    a:hover { color:var(--brand-800); }\n    @media print { .qc-no-print { display:none !important; } }\n  <\u002Fstyle>\n  <script src=\"953a03b2-d980-47a2-9bdb-16fa19e3ec61\"><\u002Fscript>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh; display:flex; background:var(--neutral-100); color:var(--neutral-900); font-family:'DM Sans',sans-serif;\">\n\n  <!-- SIDEBAR -->\n  <div class=\"qc-no-print\" style=\"width:240px; flex-shrink:0; background:var(--neutral-0); border-right:1px solid var(--neutral-200); padding:24px 16px; display:flex; flex-direction:column; gap:4px; position:sticky; top:0; height:100vh;\">\n    <div style=\"display:flex; align-items:center; gap:10px; padding:0 8px 20px;\">\n      <div style=\"width:10px; height:10px; border-radius:999px; background:var(--brand-500);\"><\u002Fdiv>\n      <span style=\"font-size:12px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:var(--neutral-500);\">Calidad<\u002Fspan>\n    <\u002Fdiv>\n    <h1 style=\"font-family:'Poppins',sans-serif; font-weight:700; font-size:17px; margin:0 0 20px; padding:0 8px; letter-spacing:-0.01em; color:var(--neutral-900);\">Calibración de Calidad<\u002Fh1>\n\n    <button sc-camel-on-click=\"{{ goEvaluacion }}\" style=\"{{ navEvalStyle }}\">\n      <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 11l3 3L22 4\"><\u002Fpath><path d=\"M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11\"><\u002Fpath><\u002Fsvg>\n      Evaluación\n    <\u002Fbutton>\n    <button sc-camel-on-click=\"{{ goResultados }}\" style=\"{{ navResultStyle }}\">\n      <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 3v18h18\"><\u002Fpath><path d=\"M18 17V9\"><\u002Fpath><path d=\"M13 17V5\"><\u002Fpath><path d=\"M8 17v-3\"><\u002Fpath><\u002Fsvg>\n      Resultados\n      <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"{{ lockIconStyle }} margin-left:auto;\"><rect x=\"3\" y=\"11\" width=\"18\" height=\"11\" rx=\"2\"><\u002Frect><path d=\"M7 11V7a5 5 0 0110 0v4\"><\u002Fpath><\u002Fsvg>\n    <\u002Fbutton>\n  <\u002Fdiv>\n\n  <!-- MAIN -->\n  <div style=\"flex:1; min-width:0; padding:32px 40px 80px;\">\n\n    <!-- EVALUACIÓN VIEW -->\n    <div style=\"{{ evaluacionViewStyle }}\">\n      <h2 style=\"font-family:'Poppins',sans-serif; font-weight:700; font-size:26px; margin:0 0 6px; color:var(--neutral-900);\">Evaluación<\u002Fh2>\n      <p style=\"margin:0 0 24px; font-size:14px; color:var(--neutral-600);\">Aplica la planilla de monitoreo y genera el ticket de calibración. Cada envío alimenta la sección Resultados.<\u002Fp>\n\n      <div style=\"background:var(--neutral-0); border:1px solid var(--neutral-200); border-radius:16px; padding:22px 24px; margin-bottom:20px;\">\n        <div style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:16px;\">\n          <div>\n            <label style=\"font-size:11px; color:var(--neutral-500); text-transform:uppercase; font-weight:600; display:block; margin-bottom:6px;\">Nombre y apellido <span style=\"color:var(--error-600);\">*<\u002Fspan><\u002Flabel>\n            <input type=\"text\" value=\"{{ evalForm.nombre }}\" sc-camel-on-change=\"{{ handleEvalField.nombre }}\" placeholder=\"NOMBRE DEL PARTICIPANTE\" style=\"width:100%; background:var(--neutral-0); border:1px solid var(--neutral-300); color:var(--neutral-900); border-radius:10px; padding:9px 12px; font-size:13px; outline:none; text-transform:uppercase;\">\n          <\u002Fdiv>\n          <div>\n            <label style=\"font-size:11px; color:var(--neutral-500); text-transform:uppercase; font-weight:600; display:block; margin-bottom:6px;\">Cargo <span style=\"color:var(--error-600);\">*<\u002Fspan><\u002Flabel>\n            <sc-raw-select value=\"{{ evalForm.cargo }}\" sc-camel-on-change=\"{{ handleEvalField.cargo }}\" style=\"width:100%; background:var(--neutral-0); border:1px solid var(--neutral-300); color:var(--neutral-900); border-radius:10px; padding:9px 12px; font-size:13px; outline:none;\">\n              <option value=\"\">Selecciona un cargo<\u002Foption>\n              <option value=\"COORDINADOR\">COORDINADOR<\u002Foption>\n              <option value=\"SUPERVISOR\">SUPERVISOR<\u002Foption>\n              <option value=\"ANALISTA\">ANALISTA<\u002Foption>\n              <option value=\"TL\">TL<\u002Foption>\n              <option value=\"GERENTE\">GERENTE<\u002Foption>\n            <\u002Fsc-raw-select>\n          <\u002Fdiv>\n          <div>\n            <label style=\"font-size:11px; color:var(--neutral-500); text-transform:uppercase; font-weight:600; display:block; margin-bottom:6px;\">Oficina <span style=\"color:var(--error-600);\">*<\u002Fspan><\u002Flabel>\n            <sc-raw-select value=\"{{ evalForm.oficina }}\" sc-camel-on-change=\"{{ handleEvalField.oficina }}\" style=\"width:100%; background:var(--neutral-0); border:1px solid var(--neutral-300); color:var(--neutral-900); border-radius:10px; padding:9px 12px; font-size:13px; outline:none;\">\n              <option value=\"\">Selecciona una oficina<\u002Foption>\n              <option value=\"PRC\">PRC<\u002Foption>\n              <option value=\"Interno\">Interno<\u002Foption>\n            <\u002Fsc-raw-select>\n          <\u002Fdiv>\n          <div>\n            <label style=\"font-size:11px; color:var(--neutral-500); text-transform:uppercase; font-weight:600; display:block; margin-bottom:6px;\">Fecha de evaluación <span style=\"color:var(--error-600);\">*<\u002Fspan><\u002Flabel>\n            <input type=\"date\" value=\"{{ evalForm.fecha }}\" sc-camel-on-change=\"{{ handleEvalField.fecha }}\" style=\"width:100%; background:var(--neutral-0); border:1px solid var(--neutral-300); color:var(--neutral-900); border-radius:10px; padding:9px 12px; font-size:13px; outline:none;\">\n          <\u002Fdiv>\n          <div>\n            <label style=\"font-size:11px; color:var(--neutral-500); text-transform:uppercase; font-weight:600; display:block; margin-bottom:6px;\">ID del chat <span style=\"color:var(--error-600);\">*<\u002Fspan><\u002Flabel>\n            <input type=\"text\" value=\"{{ evalForm.chatId }}\" sc-camel-on-change=\"{{ handleEvalField.chatId }}\" placeholder=\"98432\" style=\"width:100%; background:var(--neutral-0); border:1px solid var(--neutral-300); color:var(--neutral-900); border-radius:10px; padding:9px 12px; font-size:13px; outline:none;\">\n          <\u002Fdiv>\n          <div>\n            <label style=\"font-size:11px; color:var(--neutral-500); text-transform:uppercase; font-weight:600; display:block; margin-bottom:6px;\">Link del chat<\u002Flabel>\n            <input type=\"text\" value=\"{{ evalForm.chatLink }}\" sc-camel-on-change=\"{{ handleEvalField.chatLink }}\" placeholder=\"https://...\" style=\"width:100%; background:var(--neutral-0); border:1px solid var(--neutral-300); color:var(--neutral-900); border-radius:10px; padding:9px 12px; font-size:13px; outline:none;\">\n          <\u002Fdiv>\n          <div>\n            <label style=\"font-size:11px; color:var(--neutral-500); text-transform:uppercase; font-weight:600; display:block; margin-bottom:6px;\">Vertical <span style=\"color:var(--error-600);\">*<\u002Fspan><\u002Flabel>\n            <sc-raw-select value=\"{{ evalForm.vertical }}\" sc-camel-on-change=\"{{ handleEvalVertical }}\" style=\"width:100%; background:var(--neutral-0); border:1px solid var(--neutral-300); color:var(--neutral-900); border-radius:10px; padding:9px 12px; font-size:13px; outline:none;\">\n              <option value=\"\">Selecciona una vertical<\u002Foption>\n              <option value=\"ATI\">ATI<\u002Foption>\n              <option value=\"PAGOS\">PAGOS<\u002Foption>\n              <option value=\"ATA\">ATA<\u002Foption>\n              <option value=\"L2\">L2<\u002Foption>\n            <\u002Fsc-raw-select>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"{{ pendingNoticeStyle }}\">{{ evalPendingMessage }}<\u002Fdiv>\n\n        <div style=\"{{ evalHasRubricStyle }}\">\n          <sc-for list=\"{{ evalGroups }}\" as=\"grp\" hint-placeholder-count=\"3\">\n            <div style=\"margin-top:18px;\">\n              <div style=\"font-size:13px; font-weight:700; color:var(--neutral-800); margin-bottom:4px;\">{{ grp.title }}<\u002Fdiv>\n              <sc-for list=\"{{ grp.items }}\" as=\"it\" hint-placeholder-count=\"3\">\n                <div style=\"display:flex; justify-content:space-between; align-items:center; gap:14px; padding:10px 0; border-bottom:1px solid var(--neutral-200);\">\n                  <div style=\"flex:1; font-size:12.5px; color:var(--neutral-700);\"><b>{{ it.code }}<\u002Fb>&nbsp; {{ it.label }} <span style=\"color:var(--neutral-500);\">({{ it.weight }}%)<\u002Fspan><\u002Fdiv>\n                  <div style=\"display:flex; gap:6px; flex-shrink:0;\">\n                    <button sc-camel-on-click=\"{{ it.setCumple }}\" style=\"{{ it.cumpleStyle }}\">Cumple<\u002Fbutton>\n                    <button sc-camel-on-click=\"{{ it.setNoCumple }}\" style=\"{{ it.noCumpleStyle }}\">No cumple<\u002Fbutton>\n                    <button sc-camel-on-click=\"{{ it.setNA }}\" style=\"{{ it.naStyle }}\">N/A<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n\n          <div style=\"margin-top:22px; background:var(--error-100); border:1px solid var(--error-300); border-radius:12px; padding:16px 18px;\">\n            <div style=\"font-size:12.5px; font-weight:700; color:var(--error-700); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:10px;\">Errores críticos — cualquiera lleva la nota a 0%<\u002Fdiv>\n            <sc-for list=\"{{ evalCriticals }}\" as=\"c\" hint-placeholder-count=\"4\">\n              <label style=\"display:flex; gap:8px; align-items:flex-start; padding:6px 0; font-size:12.5px; color:var(--error-800); cursor:pointer;\">\n                <input type=\"checkbox\" checked=\"{{ c.checked }}\" sc-camel-on-change=\"{{ c.toggle }}\" style=\"margin-top:2px; accent-color:var(--error-500);\">\n                <span><b>{{ c.id }}<\u002Fb> {{ c.label }}<\u002Fspan>\n              <\u002Flabel>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <button sc-camel-on-click=\"{{ attemptSubmit }}\" style=\"margin-top:18px; background:var(--brand-500); color:var(--neutral-1000); border:none; padding:11px 20px; border-radius:10px; font-size:13.5px; font-weight:700; cursor:pointer;\">Generar reporte y enviar a Resultados<\u002Fbutton>\n          <div style=\"{{ evalErrorStyle }}\">Completa nombre, cargo, fecha e ID del chat, y marca Cumple / No cumple / N/A en todos los ítems de la rúbrica antes de generar el reporte.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"{{ evalReportStyle }}\">\n          <div style=\"display:flex; justify-content:space-between; align-items:flex-start; gap:14px; margin-bottom:16px; flex-wrap:wrap;\">\n            <div>\n              <div style=\"font-size:11px; color:var(--neutral-500); text-transform:uppercase; font-weight:600; margin-bottom:4px;\">Ticket de calibración<\u002Fdiv>\n              <div style=\"font-family:'Poppins',sans-serif; font-size:20px; font-weight:700; color:var(--brand-700);\">{{ evalReport.ticketId }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"text-align:right;\">\n              <div style=\"font-size:11px; color:var(--neutral-500); text-transform:uppercase; font-weight:600; margin-bottom:4px;\">Nota final<\u002Fdiv>\n              <div style=\"font-family:'Poppins',sans-serif; font-size:32px; font-weight:700; color:{{ evalReport.finalColor }};\">{{ evalReport.final }}%<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-bottom:14px; font-size:13px; color:var(--neutral-700);\">\n            <div><span style=\"color:var(--neutral-500);\">Participante:<\u002Fspan> {{ evalReport.nombre }}<\u002Fdiv>\n            <div><span style=\"color:var(--neutral-500);\">Cargo:<\u002Fspan> {{ evalReport.cargo }}<\u002Fdiv>\n            <div><span style=\"color:var(--neutral-500);\">Oficina:<\u002Fspan> {{ evalReport.oficina }}<\u002Fdiv>\n            <div><span style=\"color:var(--neutral-500);\">Fecha:<\u002Fspan> {{ evalReport.fecha }}<\u002Fdiv>\n            <div><span style=\"color:var(--neutral-500);\">Vertical:<\u002Fspan> {{ evalReport.vertical }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"{{ evalReportCriticalStyle }}\">\n            Error crítico detectado — la nota final se anula a 0%.\n          <\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-bottom:14px;\">\n            <div style=\"background:var(--neutral-100); border-radius:10px; padding:12px 14px;\">\n              <div style=\"font-size:11px; color:var(--neutral-500); text-transform:uppercase; margin-bottom:4px;\">Comunicación (40%)<\u002Fdiv>\n              <div style=\"font-size:20px; font-weight:700; color:var(--neutral-800);\">{{ evalReport.comm }}%<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:var(--neutral-100); border-radius:10px; padding:12px 14px;\">\n              <div style=\"font-size:11px; color:var(--neutral-500); text-transform:uppercase; margin-bottom:4px;\">Proceso (60%)<\u002Fdiv>\n              <div style=\"font-size:20px; font-weight:700; color:var(--neutral-800);\">{{ evalReport.proc }}%<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:12.5px; color:var(--neutral-500);\">Este resultado ya está disponible en la sección Resultados.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- RESULTADOS VIEW -->\n    <div style=\"{{ resultadosViewStyle }}\">\n\n      <!-- LOCK GATE -->\n      <div style=\"{{ gateStyle }}\">\n        <div style=\"max-width:340px; margin:80px auto; background:var(--neutral-0); border:1px solid var(--neutral-200); border-radius:16px; padding:32px 28px; text-align:center;\">\n          <div style=\"width:44px; height:44px; border-radius:999px; background:var(--neutral-100); display:flex; align-items:center; justify-content:center; margin:0 auto 16px;\">\n            <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--neutral-700)\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"11\" width=\"18\" height=\"11\" rx=\"2\"><\u002Frect><path d=\"M7 11V7a5 5 0 0110 0v4\"><\u002Fpath><\u002Fsvg>\n          <\u002Fdiv>\n          <div style=\"font-family:'Poppins',sans-serif; font-size:17px; font-weight:700; color:var(--neutral-900); margin-bottom:6px;\">Acceso restringido<\u002Fdiv>\n          <p style=\"font-size:13px; color:var(--neutral-600); margin:0 0 18px;\">Ingresa la clave para ver los resultados del equipo.<\u002Fp>\n          <input type=\"password\" value=\"{{ pwInput }}\" sc-camel-on-change=\"{{ handlePwInput }}\" sc-camel-on-key-down=\"{{ handlePwKeyDown }}\" placeholder=\"Clave de acceso\" style=\"width:100%; background:var(--neutral-0); border:1px solid var(--neutral-300); color:var(--neutral-900); border-radius:10px; padding:10px 12px; font-size:13px; outline:none; text-align:center; margin-bottom:10px;\">\n          <div style=\"{{ pwErrorStyle }}\">Clave incorrecta. Intenta de nuevo.<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ submitPassword }}\" style=\"width:100%; background:var(--brand-500); color:var(--neutral-1000); border:none; padding:10px; border-radius:10px; font-size:13.5px; font-weight:700; cursor:pointer;\">Ingresar<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- UNLOCKED CONTENT -->\n      <div style=\"{{ unlockedStyle }}\">\n        <div style=\"margin-bottom:24px;\">\n          <h2 style=\"font-family:'Poppins',sans-serif; font-weight:700; font-size:26px; margin:0 0 6px; color:var(--neutral-900);\">Resultados<\u002Fh2>\n          <p style=\"margin:0; font-size:14px; color:var(--neutral-600);\">Se alimenta en tiempo real de los reportes generados en Evaluación · {{ subTotal }} evaluaciones registradas<\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"qc-no-print\" style=\"display:flex; gap:10px; margin:-8px 0 20px; flex-wrap:wrap;\">\n          <button sc-camel-on-click=\"{{ downloadPDF }}\" style=\"background:var(--neutral-0); border:1px solid var(--neutral-300); color:var(--neutral-700); border-radius:10px; padding:9px 16px; font-size:12.5px; font-weight:600; cursor:pointer;\">Descargar PDF<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ downloadPNG }}\" style=\"background:var(--neutral-0); border:1px solid var(--neutral-300); color:var(--neutral-700); border-radius:10px; padding:9px 16px; font-size:12.5px; font-weight:600; cursor:pointer;\">Descargar PNG<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ downloadCSV }}\" style=\"background:var(--neutral-0); border:1px solid var(--neutral-300); color:var(--neutral-700); border-radius:10px; padding:9px 16px; font-size:12.5px; font-weight:600; cursor:pointer;\">Exportar a Sheets (CSV)<\u002Fbutton>\n        <\u002Fdiv>\n\n        <!-- EMPTY STATE -->\n        <div style=\"{{ subEmptyStyle }}\">\n          <div style=\"background:var(--neutral-0); border:1px dashed var(--neutral-300); border-radius:16px; padding:48px; text-align:center;\">\n            <div style=\"font-size:14px; color:var(--neutral-600); margin-bottom:6px;\">Todavía no hay evaluaciones registradas.<\u002Fdiv>\n            <div style=\"font-size:13px; color:var(--neutral-500);\">Ve a la sección <b>Evaluación<\u002Fb>, completa la planilla y genera un reporte para ver los resultados aquí.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div id=\"qc-capture\" style=\"{{ subContentStyle }}\">\n\n          <!-- KPI ROW -->\n          <div style=\"display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:24px;\">\n            <div style=\"background:var(--neutral-0); border:1px solid var(--neutral-200); border-radius:16px; padding:20px;\">\n              <div style=\"font-size:12px; color:var(--neutral-500); font-weight:600; text-transform:uppercase; letter-spacing:0.04em; margin-bottom:10px;\">Evaluaciones<\u002Fdiv>\n              <div style=\"font-family:'Poppins',sans-serif; font-size:32px; font-weight:700; color:var(--neutral-900);\">{{ subTotal }}<\u002Fdiv>\n              <div style=\"font-size:12px; color:var(--neutral-500); margin-top:4px;\">registradas desde Evaluación<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:var(--neutral-0); border:1px solid var(--neutral-200); border-radius:16px; padding:20px;\">\n              <div style=\"font-size:12px; color:var(--neutral-500); font-weight:600; text-transform:uppercase; letter-spacing:0.04em; margin-bottom:10px;\">Nota final promedio<\u002Fdiv>\n              <div style=\"font-family:'Poppins',sans-s :space-between; align-items:flex-start; gap:10px; margin-bottom:4px;\">\n                <div style=\"font-size:13px; font-weight:700; color:var(--neutral-800);\">Nota final promedio por cargo<\u002Fdiv>\n                <div style=\"{{ cargoFilterClearStyle }}\"><button sc-camel-on-click=\"{{ clearCargoFilter }}\" style=\"background:none; border:none; color:var(--brand-700); font-size:11.5px; font-weight:600; cursor:pointer; text-decoration:underline; padding:0;\">Quitar filtro<\u002Fbutton><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size:12px; color:var(--neutral-500); margin-bottom:14px;\">Clic en un cargo para filtrar la tabla de abajo · rojo = necesita refuerzo<\u002Fdiv>\n              <sc-for list=\"{{ barByCargo }}\" as=\"b\" hint-placeholder-count=\"4\">\n                <div sc-camel-on-click=\"{{ b.onClick }}\" style=\"{{ b.rowStyle }} margin-bottom:14px; cursor:pointer;\">\n                  <div style=\"display:flex; justify-content:space-between; align-items:baseline; font-size:12.5px; color:var(--neutral-700); margin-bottom:5px;\">\n                    <span>{{ b.cargo }} <span style=\"color:var(--neutral-400); font-weight:500;\">· {{ b.count }} eval.<\u002Fspan> <span style=\"{{ b.badgeStyle }}\">Reforzar<\u002Fspan><\u002Fspan>\n                    <span style=\"font-weight:700; color:{{ b.color }};\">{{ b.value }}%<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"background:var(--neutral-100); border-radius:999px; height:10px; overflow:hidden;\">\n                    <div style=\"height:100%; border-radius:999px; width:{{ b.width }}; background:{{ b.color }};\"><\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"{{ b.criticalNoteStyle }}\">{{ b.criticalCount }} error(es) crítico(s) en este cargo<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- TABLE -->\n          <div style=\"background:var(--neutral-0); border:1px solid var(--neutral-200); border-radius:16px; overflow:hidden;\">\n            <div style=\"padding:18px 24px; border-bottom:1px solid var(--neutral-200); font-size:14px; font-weight:700; color:var(--neutral-800);\">Detalle por evaluación <span style=\"font-size:12px; font-weight:500; color:var(--neutral-500);\">· clic en un ticket para ver la planilla completa<\u002Fspan><\u002Fdiv>\n            <div class=\"qc-no-print\" style=\"display:flex; gap:10px; align-items:end; flex-wrap:wrap; padding:16px 24px 0;\">\n              <div>\n                <label style=\"font-size:10.5px; color:var(--neutral-500); text-transform:uppercase; font-weight:600; display:block; margin-bottom:5px;\">Filtrar por fecha<\u002Flabel>\n                <input type=\"date\" value=\"{{ filterFecha }}\" sc-camel-on-change=\"{{ handleFilterFecha }}\" style=\"background:var(--neutral-0); border:1px solid var(--neutral-300); color:var(--neutral-900); border-radius:10px; padding:8px 10px; font-size:12.5px; outline:none;\">\n              <\u002Fdiv>\n              <div>\n                <label style=\"font-size:10.5px; color:var(--neutral-500); text-transform:uppercase; font-weight:600; display:block; margin-bottom:5px;\">Buscar ticket<\u002Flabel>\n                <input type=\"text\" value=\"{{ filterTicket }}\" sc-camel-on-change=\"{{ handleFilterTicket }}\" placeholder=\"#CAL-...\" style=\"background:var(--neutral-0); border:1px solid var(--neutral-300); color:var(--neutral-900); border-radius:10px; padding:8px 10px; font-size:12.5px; outline:none; width:180px;\">\n              <\u002Fdiv>\n              <button sc-camel-on-click=\"{{ clearTableFilters }}\" style=\"background:none; border:none; color:var(--brand-700); font-size:12px; font-weight:600; cursor:pointer; text-decoration:underline; padding:8px 0;\">Quitar filtros<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"overflow-x:auto;\">\n            <sc-raw-table style=\"width:100%; border-
