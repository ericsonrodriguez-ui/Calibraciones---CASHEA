            <\u002Fsc-raw-td>\n                    <sc-raw-td style=\"padding:12px; color:var(--neutral-700);\">{{ sr.cargo }}<\u002Fsc-raw-td>\n                    <sc-raw-td style=\"padding:12px; color:var(--neutral-700);\">{{ sr.vertical }}<\u002Fsc-raw-td>\n                    <sc-raw-td style=\"padding:12px;\"><span style=\"color:var(--brand-700); font-size:12px; font-weight:600; text-decoration:underline;\">{{ sr.ticketId }}<\u002Fspan><\u002Fsc-raw-td>\n                    <sc-raw-td style=\"padding:12px; color:var(--neutral-700);\">{{ sr.comm }}%<\u002Fsc-raw-td>\n                    <sc-raw-td style=\"padding:12px; color:var(--neutral-700);\">{{ sr.proc }}%<\u002Fsc-raw-td>\n                    <sc-raw-td style=\"padding:12px; font-weight:700; color:{{ sr.finalColorStyle }};\">{{ sr.final }}%<\u002Fsc-raw-td>\n                    <sc-raw-td style=\"padding:12px; font-weight:700; color:{{ sr.desvColorStyle }};\">{{ sr.desvLabel }}<\u002Fsc-raw-td>\n                  <\u002Fsc-raw-tr>\n                  <sc-raw-tr style=\"{{ sr.expandRowStyle }}\">\n                    <sc-raw-td colspan=\"8\" style=\"padding:4px 20px 22px; background:var(--neutral-50);\">\n                      <div style=\"{{ sr.criticalNoticeStyle }}\">Error crítico detectado — la nota final se anula a 0%.<\u002Fdiv>\n                      <div style=\"display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:10px 0 16px;\">\n                        <div style=\"background:var(--neutral-0); border:1px solid var(--neutral-200); border-radius:10px; padding:10px 12px;\">\n                          <div style=\"font-size:10px; color:var(--neutral-500); text-transform:uppercase; margin-bottom:4px;\">Fecha<\u002Fdiv>\n                          <div style=\"font-size:13px; font-weight:700; color:var(--neutral-800);\">{{ sr.fecha }}<\u002Fdiv>\n                        <\u002Fdiv>\n                        <div style=\"background:var(--neutral-0); border:1px solid var(--neutral-200); border-radius:10px; padding:10px 12px;\">\n                          <div style=\"font-size:10px; color:var(--neutral-500); text-transform:uppercase; margin-bottom:4px;\">Comunicación<\u002Fdiv>\n                          <div style=\"font-size:13px; font-weight:700; color:var(--neutral-800);\">{{ sr.comm }}%<\u002Fdiv>\n                        <\u002Fdiv>\n                        <div style=\"background:var(--neutral-0); border:1px solid var(--neutral-200); border-radius:10px; padding:10px 12px;\">\n                          <div style=\"font-size:10px; color:var(--neutral-500); text-transform:uppercase; margin-bottom:4px;\">Proceso<\u002Fdiv>\n                          <div style=\"font-size:13px; font-weight:700; color:var(--neutral-800);\">{{ sr.proc }}%<\u002Fdiv>\n                        <\u002Fdiv>\n                        <div style=\"background:var(--neutral-0); border:1px solid var(--neutral-200); border-radius:10px; padding:10px 12px;\">\n                          <div style=\"font-size:10px; color:var(--neutral-500); text-transform:uppercase; margin-bottom:4px;\">Nota final<\u002Fdiv>\n                          <div style=\"font-size:13px; font-weight:700; color:{{ sr.finalColorStyle }};\">{{ sr.final }}%<\u002Fdiv>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n                      <div style=\"font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--neutral-500); margin-bottom:8px;\">Ítems de la planilla<\u002Fdiv>\n                      <sc-for list=\"{{ sr.expandItems }}\" as=\"ti\" hint-placeholder-count=\"6\">\n                        <div style=\"display:flex; justify-content:space-between; align-items:center; gap:10px; padding:6px 0; border-bottom:1px solid var(--neutral-200); font-size:12.5px;\">\n                          <span style=\"color:var(--neutral-700);\"><b>{{ ti.code }}<\u002Fb> {{ ti.label }}<\u002Fspan>\n                          <span style=\"font-weight:700; color:{{ ti.color }};\">{{ ti.statusLabel }}<\u002Fspan>\n                        <\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fsc-raw-td>\n                  <\u002Fsc-raw-tr>\n                <\u002Fsc-raw-tbody>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-table>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- RESUMEN FINAL -->\n          <div style=\"background:var(--neutral-0); border:1px solid var(--neutral-200); border-radius:16px; padding:24px; margin-top:24px;\">\n            <div style=\"display:flex; align-items:center; gap:8px; margin-bottom:4px; flex-wrap:wrap;\">\n              <div style=\"font-size:15px; font-weight:700; color:var(--neutral-900);\">Resumen final de calibración<\u002Fdiv>\n              <span style=\"background:var(--brand-100); color:var(--brand-800); font-size:10px; font-weight:700; text-transform:uppercase; padding:2px 8px; border-radius:999px;\">Solo analista experto<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-size:12px; color:var(--neutral-500); margin-bottom:16px;\">Minuta generada a partir de los datos registrados en Evaluación.<\u002Fdiv>\n\n            <div style=\"{{ summaryGateStyle }}\">\n              <p style=\"font-size:13px; color:var(--neutral-600); margin:0 0 14px;\">Ingresa la clave del analista experto para ver el resumen final.<\u002Fp>\n              <div class=\"qc-no-print\" style=\"display:flex; gap:10px; max-width:320px;\">\n                <input type=\"password\" value=\"{{ summaryPwInput }}\" sc-camel-on-change=\"{{ handleSummaryPwInput }}\" sc-camel-on-key-down=\"{{ handleSummaryPwKeyDown }}\" placeholder=\"Clave de acceso\" style=\"flex:1; background:var(--neutral-0); border:1px solid var(--neutral-300); color:var(--neutral-900); border-radius:10px; padding:10px 12px; font-size:13px; outline:none;\">\n                <button sc-camel-on-click=\"{{ submitSummaryPassword }}\" style=\"background:var(--brand-500); color:var(--neutral-1000); border:none; padding:10px 18px; border-radius:10px; font-size:13px; font-weight:700; cursor:pointer;\">Ingresar<\u002Fbutton>\n              <\u002Fdiv>\n              <div style=\"{{ summaryPwErrorStyle }}\">Clave incorrecta.<\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"{{ summaryContentStyle }}\">\n            <div style=\"font-size:13.5px; color:var(--neutral-800); line-height:1.6; margin-bottom:14px;\">{{ summaryVerdict }}<\u002Fdiv>\n            <div style=\"{{ summaryAlertsStyle }}\">\n              <div style=\"font-size:12px; font-weight:700; color:var(--error-700); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:8px;\">Alertas<\u002Fdiv>\n              <sc-for list=\"{{ summaryAlertsList }}\" as=\"al\" hint-placeholder-count=\"2\">\n                <div style=\"font-size:13px; color:var(--error-700); padding:6px 0; border-bottom:1px solid var(--error-100);\">• {{ al }}<\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"{{ summaryFindingsStyle }}\">\n              <div style=\"font-size:12px; font-weight:700; color:var(--neutral-600); text-transform:uppercase; letter-spacing:0.04em; margin:16px 0 8px;\">Atributos más descalibrados<\u002Fdiv>\n              <sc-for list=\"{{ summaryAttrIssuesList }}\" as=\"ai\" hint-placeholder-count=\"3\">\n                <div style=\"display:flex; justify-content:space-between; font-size:13px; color:var(--neutral-700); padding:6px 0; border-bottom:1px solid var(--neutral-100);\"><span>{{ ai.label }}<\u002Fspan><span style=\"font-weight:700; color:var(--error-600);\">{{ ai.mismatches }} desalineado(s)<\u002Fspan><\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"{{ summaryWorstStyle }}\">\n              <div style=\"font-size:12px; font-weight:700; color:var(--neutral-600); text-transform:uppercase; letter-spacing:0.04em; margin:16px 0 8px;\">Participantes más desalineados<\u002Fdiv>\n              <sc-for list=\"{{ summaryWorstList }}\" as=\"w\" hint-placeholder-count=\"3\">\n                <div style=\"display:flex; justify-content:space-between; font-size:13px; color:var(--neutral-700); padding:6px 0; border-bottom:1px solid var(--neutral-100);\"><span>{{ w.nombre }}<\u002Fspan><span style=\"font-weight:700; color:var(--error-600);\">{{ w.desv }}% de desviación<\u002Fspan><\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"{{ summaryRecStyle }}\">\n              <div style=\"font-size:12px; font-weight:700; color:var(--neutral-600); text-transform:uppercase; letter-spacing:0.04em; margin:16px 0 8px;\">Recomendaciones<\u002Fdiv>\n              <sc-for list=\"{{ summaryRecommendationsList }}\" as=\"r\" hint-placeholder-count=\"2\">\n                <div style=\"font-size:13px; color:var(--neutral-700); padding:6px 0; border-bottom:1px solid var(--neutral-100);\">• {{ r }}<\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\n\nconst RESULTS_PASSWORD = '987654321';\n\nfunction statusLabel(st) { return st === 'cumple' ? 'Cumple' : st === 'no_cumple' ? 'No cumple' : st === 'na' ? 'N/A' : 'Sin marcar'; }\n\nconst RUBRICS = {\n  ATI: {\n    groups: [\n      { title: 'Comunicación (40%)', section: 'comm', items: [\n        ['1.1','Gestión del tiempo de primera respuesta',4],\n        ['1.2','Gestión del tiempo entre respuestas',4],\n        ['1.3','Eficiencia en la conversación',5],\n        ['1.4','Responde todos los puntos del mensaje',5],\n        ['1.5','Instrucciones numeradas y específicas',7],\n        ['1.6','Explica el contexto antes de la instrucción',5],\n        ['1.7','Empatía ante bloqueo',4],\n        ['1.8','Tono resolutivo en casos complejos',3],\n        ['1.9','Calidad de escritura',3]\n      ]},\n      { title: 'Proceso — Diagnóstico y contexto (10%)', section: 'proc', items: [\n        ['2.1','Lectura activa del historial',6],\n        ['2.2','Continuidad del caso',4]\n      ]},\n      { title: 'Proceso — Control de identidad (10%)', section: 'proc', items: [\n        ['2.3','Protocolo de validación de identidad',10]\n      ]},\n      { title: 'Proceso — Control de acciones en Retool (15%)', section: 'proc', items: [\n        ['2.4','Autorización para cambios de alto impacto',5],\n        ['2.5','Mínima intervención',3],\n        ['2.6','Registro antes y después',5],\n        ['2.7','Confirmación post-ejecución',2]\n      ]},\n      { title: 'Proceso — Documentación y cierre (10%)', section: 'proc', items: [\n        ['2.8','Documentación completa',4],\n        ['2.9','Tipificación correcta',4],\n        ['2.10','Snooze correcto',2]\n      ]},\n      { title: 'Proceso — Escalado (15%)', section: 'proc', items: [\n        ['2.11','Criterio correcto de escalado',5],\n        ['2.12','Canal correcto de escalado',5],\n        ['2.13','Documenta el escalado en Slack',5]\n      ]}\n    ],\n    criticals: [\n      ['D1','Omisión del motivo principal del contacto'],\n      ['D2','Protocolo de seguridad violado'],\n      ['D3','Información incorrecta al cliente'],\n      ['D4','Escalado ignorado o canal informal'],\n      ['D5','Fricción activa con el cliente'],\n      ['D6','Ejecución no autorizada en Retool'],\n      ['D7','Campo o puntos incorrecto modificado'],\n      ['D8','Abandono de la conversación en curso']\n    ]\n  },\n  PAGOS: {\n    groups: [\n      { title: 'Comunicación (40%)', section: 'comm', items: [\n        ['C1','Gestión del tiempo de respuesta',6],\n        ['C2','Claridad de la respuesta',6],\n        ['C3','Responde todos los puntos',6],\n        ['C4','Instrucciones precisas',6],\n        ['C5','Empatía financiera',6],\n        ['C6','Tono sin fricción interna',5],\n        ['C7','Precisión en la escritura de montos',5]\n      ]},\n      { title: 'Proceso — Diagnóstico (30%)', section: 'proc', items: [\n        ['P1','Lectura activa e historial',6],\n        ['P2','Identificación del motivo',6],\n        ['P3','Diagnóstico y módulo correcto',6],\n        ['P4','Búsqueda en pasarela',6],\n        ['P5','Estado del pago antes de accionar',6]\n      ]},\n      { title: 'Proceso — Ejecución en Retool (10%)', section: 'proc', items: [\n        ['P6','Ejecución correcta en Retool',5],\n        ['P7','Documentación con evidencia visual',5]\n      ]},\n      { title: 'Proceso — Resolución técnica (10%)', section: 'proc', items: [\n        ['P8','Verificación del resultado en Retool',5],\n        ['P9','Tipificación del pago aplicado',3],\n        ['P10','Snooze correcto',2]\n      ]},\n      { title: 'Proceso — Escalado (10%)', section: 'proc', items: [\n        ['P11','Proceso de escalado a L2',5],\n        ['P12','Documentación antes del escalado',5]\n      ]}\n    ],\n    criticals: [\n      ['EC-C','Frustra activamente al cliente'],\n      ['EC-P1','Omisión del motivo principal'],\n      ['EC-P2','Acción incorrecta en Retool con impacto'],\n      ['EC-P3','Información incorrecta sobre pagos o políticas'],\n      ['EC-P4','Escalado incorrecto o canal informal'],\n      ['IND-1','Manipulación de datos o registros falsos'],\n      ['IND-2','Mal uso de Retool en usuario no relacionado'],\n      ['IND-3','Divulgación de información confidencial'],\n      ['IND-4','Abandono de conversación activa con pago en curso']\n    ]\n  }\n};\n\nclass Component extends DCLogic {\n  state = {\n    activeSection: 'evaluacion',\n    resultsUnlocked: false,\n    pwInput: '',\n    pwError: false,\n    submissions: [],\n    expertId: null,\n    matrixVertical: null,\n    matrixFullscreen: false,\n    cargoFilter: null,\n    expandedId: null,\n    evalForm: { nombre: '', cargo: '', oficina: '', fecha: '', chatId: '', chatLink: '', vertical: '' },\n    evalStatuses: {},\n    evalCriticos: {},\n    evalError: false,\n    lastReport: null,\n    summaryUnlocked: false,\n    summaryPwInput: '',\n    summaryPwError: false,\n    filterFecha: '',\n    filterTicket: ''\n  };\n\n  toggleExpert(id) {\n    this.setState(s => ({ expertId: s.expertId === id ? null : id }));\n  }\n\n  setEvalStatus(id, status) {\n    this.setState(s => ({ evalStatuses: { ...s.evalStatuses, [id]: status } }));\n  }\n\n  toggleEvalCritical(id) {\n    this.setState(s => ({ evalCriticos: { ...s.evalCriticos, [id]: !s.evalCriticos[id] } }));\n  }\n\n  attemptSubmit() {\n    const s = this.state;\n    const ef = s.evalForm;\n    const rubric = RUBRICS[ef.vertical];\n    const missingRubric = rubric ? rubric.groups.some(g => g.items.some(([code]) => !s.evalStatuses[code])) : true;\n    const valid = !!(ef.nombre && ef.cargo && ef.oficina && ef.fecha && ef.chatId && ef.vertical && rubric && !missingRubric);\n    if (!valid) { this.setState({ evalError: true }); return; }\n    this.setState({ evalError: false });\n    this.submitEvaluation();\n  }\n\n  exportCSV() {\n    const s = this.state;\n    const expert = s.expertId ? s.submissions.find(e => e.id === s.expertId) : null;\n    const header = ['Participante','Cargo','Vertical','Ticket','Comunicacion','Proceso','Nota final','Desviacion'];\n    const rows = s.submissions.map(x => {\n      const desv = expert && x.id !== expert.id ? Math.abs(x.final - expert.final) : '';\n      return [x.nombre, x.cargo, x.vertical, x.ticketId, x.comm, x.proc, x.final, desv];\n    });\n    const csv = [header, ...rows].map(r => r.map(v => `\"${String(v).replace(/\"/g,'\"\"')}\"`).join(',')).join('\\n');\n    const blob = new Blob(['\\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });\n    const url = URL.createObjectURL(blob);\n    const a = document.createElement('a');\n    a.href = url; a.download = 'calibracion_resultados.csv';\n    document.body.appendChild(a); a.click(); document.body.removeChild(a);\n    URL.revokeObjectURL(url);\n  }\n\n  exportPNG() {\n    const el = document.getElementById('qc-capture');\n    if (!el || !window.html2canvas) return;\n    window.html2canvas(el, { backgroundColor: '#F5F4F2', scale: 2 }).then(canvas => {\n      const a = document.createElement('a');\n      a.href = canvas.toDataURL('image/png');\n      a.download = 'calibracion_resultados.png';\n      document.body.appendChild(a); a.click(); document.body.removeChild(a);\n    });\n  }\n\n  exportPDF() {\n    window.print();\n  }\n\n  checkPassword() {\n    if (this.state.pwInput === RESULTS_PASSWORD) {\n      this.setState({ resultsUnlocked: true, pwError: false, pwInput: '' });\n    } else {\n      this.setState({ pwError: true });\n    }\n  }\n\n  checkSummaryPassword() {\n    if (this.state.summaryPwInput === RESULTS_PASSWORD) {\n      this.setState({ summaryUnlocked: true, summaryPwError: false, summaryPwInput: '' });\n    } else {\n      this.setState({ summaryPwError: true });\n    }\n  }\n\n  submitEvaluation() {\n    const s = this.state;\n    const ef = s.evalForm;\n    const rubric = RUBRICS[ef.vertical];\n    if (!rubric) return;\n    const anyCritical = Object.values(s.evalCriticos).some(v => v);\n    let commSum = 0, procSum = 0;\n    rubric.groups.forEach(g => g.items.forEach(([code, , weight]) => {\n      const status = s.evalStatuses[code];\n      if (status === 'cumple' || status === 'na') {\n        if (g.section === 'comm') commSum += weight; else procSum += weight;\n      }\n    }));\n    const final = anyCritical ? 0 : commSum + procSum;\n    const year = ef.fecha ? ef.fecha.slice(0, 4) : '2026';\n    const ticketId = `#CAL-${ef.vertical}-${ef.chatId || 'SINID'}-${year}`;\n    const submission = {\n      id: Date.now(), ticketId, nombre: ef.nombre || 'Sin nombre', cargo: ef.cargo || '—', oficina: ef.oficina || '—', vertical: ef.vertical,\n      fecha: ef.fecha || '—', comm: anyCritical ? 0 : commSum, proc: anyCritical ? 0 : procSum, final, critical: anyCritical,\n      itemScores: { ...s.evalStatuses }, criticosMarked: { ...s.evalCriticos }\n    };\n    this.setState(st => ({\n      submissions: [...st.submissions, submission],\n      lastReport: submission,\n      evalForm: { nombre: '', cargo: '', oficina: '', fecha: '', chatId: '', chatLink: '', vertical: '' },\n      evalStatuses: {},\n      evalCriticos: {}\n    }));\n  }\n\n  renderVals() {\n    const s = this.state;\n    const isEval = s.activeSection === 'evaluacion';\n    const isResult = s.activeSection === 'resultados';\n    const navBase = 'display:flex; align-items:center; gap:10px; width:100%; text-align:left; border:none; background:transparent; padding:10px 8px; border-radius:10px; font-size:13.5px; font-weight:600; cursor:pointer; margin-bottom:2px;';\n\n    const subs = s.submissions;\n    const expert = s.expertId ? subs.find(x => x.id === s.expertId) : null;\n    const subAvgFinal = subs.length ? Math.round(subs.reduce((a,x)=>a+x.final,0)/subs.length) : 0;\n    const subCriticalCount = subs.filter(x => x.critical).length;\n    const subDesvColor = (v) => v <= 5 ? 'var(--success-600)' : v <= 12 ? 'var(--warning-600)' : 'var(--error-600)';\n    const subFinalColor = (v) => v >= 90 ? 'var(--success-600)' : v >= 70 ? 'var(--warning-600)' : 'var(--error-600)';\n    const subDesvValues = expert ? subs.filter(x=>x.id!==expert.id).map(x => Math.abs(x.final-expert.final)) : [];\n    const subAvgDesv = expert && subDesvValues.length ? Math.round(subDesvValues.reduce((a,b)=>a+b,0)/subDesvValues.length) : null;\n\n    const subRows = subs.map((x) => {\n      const isExpert = x.id === s.expertId;\n      const desv = expert && !isExpert ? Math.abs(x.final-expert.final) : null;\n      const isExpanded = s.expandedId === x.id;\n      const expandItems = (RUBRICS[x.vertical] ? RUBRICS[x.vertical].groups.flatMap(g => g.items.map(([code,label]) => ({ code, label }))) : []).map(it => {\n        const st = x.itemScores[it.code];\n        return { code: it.code, label: it.label, statusLabel: statusLabel(st), color: st === 'cumple' ? 'var(--success-600)' : st === 'no_cumple' ? 'var(--error-600)' : 'var(--neutral-500)' };\n      });\n      return {\n        ...x,\n        isExpert,\n        desvLabel: isExpert ? 'Referencia' : desv === null ? '—' : desv + '%',\n        desvColorStyle: isExpert ? 'var(--brand-600)' : desv === null ? 'var(--neutral-500)' : subDesvColor(desv),\n        finalColorStyle: x.critical ? 'var(--error-600)' : subFinalColor(x.final),\n        toggleExpertClick: (e) => { e.stopPropagation(); this.toggleExpert(x.id); },\n        expertBtnStyle: `background:transparent; border:none; cursor:pointer; font-size:15px; padding:0; color:${isExpert ? 'var(--brand-600)' : 'var(--neutral-300)'};`,\n        expertBadgeStyle: `display:${isExpert ? 'inline-flex' : 'none'}; background:var(--brand-500); color:var(--neutral-1000); font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; padding:2px 8px; border-radius:999px;`,\n        criticalBadgeStyle: `display:${x.critical ? 'inline-flex' : 'none'}; background:var(--error-100); color:var(--error-700); border:1px solid var(--error-300); font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:999px;`,\n        toggleExpand: () => this.setState(st2 => ({ expandedId: st2.expandedId === x.id ? null : x.id })),\n        expandRowStyle: `display:${isExpanded ? 'table-row' : 'none'};`,\n        chevronLabel: isExpanded ? '▾' : '▸',\n        criticalNoticeStyle: `display:${x.critical ? 'block' : 'none'}; background:var(--error-100); border:1px solid var(--error-300); color:var(--error-700); border-radius:10px; padding:10px 12px; font-size:12.5px; font-weight:600;`,\n        expandItems\n      };\n    });\n    const filteredSubRows = (s.cargoFilter ? subRows.filter(r => r.cargo === s.cargoFilter) : subRows)\n      .filter(r => !s.filterFecha || r.fecha === s.filterFecha)\n      .filter(r => !s.filterTicket || r.ticketId.toLowerCase().includes(s.filterTicket.toLowerCase()));\n\n    const subEmptyStyle = `display:${subs.length === 0 ? 'block' : 'none'};`;\n    const subContentStyle = `display:${subs.length === 0 ? 'none' : 'block'};`;\n    const subDesvSubtitle = expert ? `vs. ${expert.nombre} (experto)` : 'marca un ★ en la tabla para comparar';\n    const subAvgDesvLabel = subAvgDesv === null ? '—' : subAvgDesv + '%';\n\n    // scatter: final vs desviación\n    const calMin = 0, calMax = 100, desvMin = 0, desvMax = 40;\n    const gridLines = [0,10,20,30,40].map(v => ({ y: 220 - (v/desvMax)*200, label: v }));\n    const avgLineX = 40 + (Math.min(subAvgFinal,calMax)-calMin)/(calMax-calMin) * 340;\n    const scatterPoints = subs.map(x => {\n      const isExpert = x.id === (expert && expert.id);\n      const desv = expert && !isExpert ? Math.abs(x.final-expert.final) : 0;\n      const cx2 = 40 + (Math.min(x.final,calMax)-calMin)/(calMax-calMin) * 340;\n      const cy2 = 220 - (Math.min(desv,desvMax)-desvMin)/(desvMax-desvMin) * 200;\n      return {\n        cx: cx2, cy: cy2,\n        color: x.critical ? 'var(--error-500)' : isExpert ? 'var(--brand-600)' : 'var(--info-500)',\n        title: `${x.nombre} (${x.cargo})${isExpert ? ' · Experto' : ''}\\nNota final: ${x.final}%${expert && !isExpert ? ' · Desviación: '+desv+'%' : ''}`,\n        onClick: () => this.setState(st2 => ({ expandedId: st2.expandedId === x.id ? null : x.id, cargoFilter: null }))\n      };\n    });\n\n    // bar by cargo (avg final)\n    const cargos = [...new Set(subs.map(x => x.cargo))];\n    const cargoStats = cargos.map(c => {\n      const grp = subs.filter(x => x.cargo === c);\n      const avgFinal = Math.round(grp.reduce((a,x)=>a+x.final,0)/grp.length);\n      const critCount = grp.filter(x=>x.critical).length;\n      return { cargo: c, avgFinal, count: grp.length, critCount };\n    }).sort((a,b) => a.avgFinal - b.avgFinal);\n    const barByCargo = cargoStats.map(c => {\n      const needsReinforcement = c.avgFinal < 80 || c.critCount > 0;\n      const active = s.cargoFilter === c.cargo;\n      return {\n        cargo: c.cargo, value: c.avgFinal, width: Math.max(c.avgFinal,2)+'%', color: subFinalColor(c.avgFinal),\n        count: c.count, criticalCount: c.critCount,\n        criticalNoteStyle: `display:${c.critCount>0 ? 'block' : 'none'}; font-size:10.5px; color:var(--error-600); margin-top:4px;`,\n        badgeStyle: `display:${needsReinforcement ? 'inline' : 'none'}; background:var(--error-100); color:var(--error-700); font-size:9.5px; font-weight:700; padding:1px 6px; border-radius:999px; margin-left:6px; text-transform:uppercase;`,\n        rowStyle: active ? 'background:var(--brand-100); border-radius:10px; padding:8px; margin:-8px -8px 6px;' : '',\n        onClick: () => this.setState(st2 => ({ cargoFilter: st2.cargoFilter === c.cargo ? null : c.cargo }))\n      };\n    });\n    const cargoFilterClearStyle = `display:${s.cargoFilter ? 'block' : 'none'};`;\n    const clearCargoFilter = () => this.setState({ cargoFilter: null });\n\n    // resumen final (solo con experto marcado)\n    const summaryParticipants = expert ? subs.filter(x => x.vertical === expert.vertical && x.id !== expert.id) : [];\n    const summaryRubric = expert ? RUBRICS[expert.vertical] : null;\n    let summaryAttrIssues = [];\n    if (expert && summaryRubric) {\n      const allItems = summaryRubric.groups.flatMap(g => g.items.map(([code,label]) => ({ code, label })));\n      summaryAttrIssues = allItems.map(item => ({\n        label: item.label,\n        mismatches: summaryParticipants.filter(p => p.itemScores[item.code] && p.itemScores[item.code] !== expert.itemScores[item.code]).length\n      })).filter(a => a.mismatches > 0).sort((a,b) => b.mismatches - a.mismatches).slice(0,3);\n      const critIssues = summaryRubric.criticals.map(([id,label]) => ({\n        label, mismatches: summaryParticipants.filter(p => !!(p.criticosMarked && p.criticosMarked[id])).length\n      })).filter(a => a.mismatches > 0).sort((a,b) => b.mismatches - a.mismatches).slice(0,2);\n      summaryAttrIssues = summaryAttrIssues.concat(critIssues);\n    }\n    const summaryWorst = summaryParticipants.map(p => ({ nombre: p.nombre, desv: Math.abs(p.final - (expert ? expert.final : 0)) }))\n      .sort((a,b) => b.desv - a.desv).slice(0,3);\n    const summaryCriticalCount = summaryParticipants.filter(p => p.critical).length;\n    const summaryAvgDesv = summaryParticipants.length ? Math.round(summaryParticipants.reduce((a,p) => a + Math.abs(p.final - expert.final), 0) / summaryParticipants.length) : 0;\n\n    const summaryVerdict = !expert\n      ? 'Marca a un participante como analista experto (★) en la tabla de abajo para generar el resumen final de la calibración.'\n      : summaryParticipants.length === 0\n      ? `Solo se registró la evaluación del experto (${expert.nombre}) en la vertical ${expert.vertical}. Se necesitan más evaluaciones del equipo para calibrar.`\n      : summaryAvgDesv <= 5\n      ? `El equipo está bien calibrado. La desviación promedio frente a ${expert.nombre} es de ${summaryAvgDesv}%, dentro del rango aceptable.`\n      : summaryAvgDesv <= 12\n      ? `El equipo muestra una calibración moderada frente a ${expert.nombre}, con una desviación promedio de ${summaryAvgDesv}%. Hay espacio de mejora, pero no es crítico.`\n      : `El equipo está descalibrado. La desviación promedio frente a ${expert.nombre} es de ${summaryAvgDesv}%, por encima de lo aceptable. Se requiere intervención.`;\n\n    const summaryAlertsList = [];\n    if (summaryCriticalCount > 0) summaryAlertsList.push(`${summaryCriticalCount} evaluación(es) tuvieron errores críticos que anulan la nota a 0%.`);\n    if (summaryAvgDesv > 12) summaryAlertsList.push('La desviación promedio supera el 12%, lo que indica diferencias de criterio relevantes con el experto.');\n    if (summaryAttrIssues.length && summaryParticipants.length && summaryAttrIssues[0].mismatches >= Math.ceil(summaryParticipants.length/2)) summaryAlertsList.push(`El atributo \"${summaryAttrIssues[0].label}\" está descalibrado en más de la mitad del equipo.`);\n\n    const summaryRecommendationsList = [];\n    if (summaryAttrIssues.length) summaryRecommendationsList.push(`Reforzar capacitación en: ${summaryAttrIssues.slice(0,3).map(a=>a.label).join(', ')}.`);\n    if (summaryWorst.length && summaryWorst[0].desv > 0) summaryRecommendationsList.push(`Dar seguimiento cercano a ${summaryWorst.filter(w=>w.desv>0).slice(0,2).map(w=>w.nombre).join(' y ')} por mayor desviación frente al experto.`);\n    if (summaryCriticalCount > 0) summaryRecommendationsList.push('Revisar los casos con error crítico en detalle y dar feedback individual.');\n    if (!summaryRecommendationsList.length && expert && summaryParticipants.length) summaryRecommendationsList.push('Mantener el nivel actual de calibración con revisiones periódicas.');\n\n    // attribute matrix\n    const verticalsPresent = [...new Set(subs.map(x => x.vertical))];\n    const activeVertical = s.matrixVertical && verticalsPresent.includes(s.matrixVertical) ? s.matrixVertical\n      : (expert && verticalsPresent.includes(expert.vertical) ? expert.vertical : verticalsPresent[0]) || null;\n    const matrixRubric = activeVertical ? RUBRICS[activeVertical] : null;\n    const matrixItems = matrixRubric ? matrixRubric.groups.flatMap(g => g.items.map(([code,label]) => ({ code, label }))) : [];\n    const matrixExpert = expert && expert.vertical === activeVertical ? expert : null;\n    const matrixParticipants = subs.filter(x => x.vertical === activeVertical && !(matrixExpert && x.id === matrixExpert.id));\n\n    const matrixRows = matrixItems.map(item => {\n      const expSt = matrixExpert ? matrixExpert.itemScores[item.code] : null;\n      const expertCell = {\n        wrapperStyle: `display:${matrixExpert ? 'flex' : 'none'};`,\n        bg: expSt === 'cumple' ? 'var(--success-500)' : expSt === 'no_cumple' ? 'var(--error-500)' : 'var(--neutral-300)',\n        label: expSt === 'cumple' ? 'C' : expSt === 'no_cumple' ? 'X' : '—',\n        title: matrixExpert ? `${item.label} · ${matrixExpert.nombre} (experto)\\n${statusLabel(expSt)}` : ''\n      };\n      return {\n        label: item.label,\n        expertCell,\n        cells: matrixParticipants.map(p => {\n          const st = p.itemScores[item.code];\n          let bg, label;\n          if (matrixExpert) {\n            if (!st) { bg = 'var(--neutral-300)'; label = '—'; }\n            else if (st === expSt) { bg = 'var(--success-500)'; label = '✓'; }\n            else { bg = 'var(--error-500)'; label = '✕'; }\n          } else {\n            bg = st === 'cumple' ? 'var(--success-500)' : st === 'no_cumple' ? 'var(--error-500)' : 'var(--neutral-300)';\n            label = st === 'cumple' ? 'C' : st === 'no_cumple' ? 'X' : '—';\n          }\n          const title = matrixExpert\n            ? `${item.label} · ${p.nombre}\\n${p.nombre}: ${statusLabel(st)} · Experto: ${statusLabel(expSt)}`\n            : `${item.label} · ${p.nombre}\\n${statusLabel(st)}`;\n          return { bg, label, title };\n        })\n      };\n    });\n\n    const matrixCriticals = matrixRubric ? matrixRubric.criticals.map(([id,label]) => ({ id, label })) : [];\n    const critStatus = (sub, critId) => sub && sub.criticosMarked && sub.criticosMarked[critId] ? 'no_cumple' : 'cumple';\n    const matrixCriticalRows = matrixCriticals.map(item => {\n      const expSt = matrixExpert ? critStatus(matrixExpert, item.id) : null;\n      const expertCell = {\n        wrapperStyle: `display:${matrixExpert ? 'flex' : 'none'};`,\n        bg: expSt === 'cumple' ? 'var(--success-500)' : expSt === 'no_cumple' ? 'var(--error-500)' : 'var(--neutral-300)',\n        label: expSt === 'cumple' ? 'OK' : expSt === 'no_cumple' ? 'ERR' : '—',\n        title: matrixExpert ? `${item.label} · ${matrixExpert.nombre} (experto)\\n${expSt === 'no_cumple' ? 'Error crítico marcado' : 'Sin error'}` : ''\n      };\n      return {\n        label: item.label,\n        expertCell,\n        cells: matrixParticipants.map(p => {\n          const st = critStatus(p, item.id);\n          let bg, label;\n          if (matrixExpert) {\n            if (st === expSt) { bg = 'var(--success-500)'; label = '✓'; }\n            else { bg = 'var(--error-500)'; label = '✕'; }\n          } else {\n            bg = st === 'cumple' ? 'var(--success-500)' : 'var(--error-500)';\n            label = st === 'cumple' ? 'OK' : 'ERR';\n          }\n          const title = matrixExpert\n            ? `${item.label} · ${p.nombre}\\n${p.nombre}: ${st === 'no_cumple' ? 'Error crítico' : 'Sin error'} · Experto: ${expSt === 'no_cumple' ? 'Error crítico' : 'Sin error'}`\n            : `${item.label} · ${p.nombre}\\n${st === 'no_cumple' ? 'Error crítico' : 'Sin error'}`;\n          return { bg, label, title };\n        })\n      };\n    });\n\n    const matrixSubtitle = matrixExpert\n      ? `Verde = calibrado con ${matrixExpert.nombre} · Rojo = descalibrado · vertical ${activeVertical}`\n      : (activeVertical ? `Estado propio por atributo · vertical ${activeVertical}` : 'Sin evaluaciones aún');\n    const matrixCardStyle = s.matrixFullscreen\n      ? 'position:fixed; inset:0; z-index:60; background:var(--neutral-0); border-radius:0; padding:28px 32px; margin:0; overflow-y:auto;'\n      : 'background:var(--neutral-0); border:1px solid var(--neutral-200); border-radius:16px; padding:20px 24px; margin-bottom:24px;';\n    const matrixFullscreenLabel = s.matrixFullscreen ? 'Cerrar' : 'Pantalla completa';\n    const toggleMatrixFullscreen = () => this.setState(st2 => ({ matrixFullscreen: !st2.matrixFullscreen }));\n\n    // EVALUACIÓN\n    const ef = s.evalForm;\n    const rubric = RUBRICS[ef.vertical];\n    const showPendingNotice = ef.vertical === 'ATA' || ef.vertical === 'L2';\n    const evalHasRubric = !!rubric;\n\n    const btnBase = 'border-radius:8px; padding:6px 11px; font-size:11.5px; font-weight:600; cursor:pointer; border:1px solid var(--neutral-300);';\n    const styleFor = (active, activeBg, activeColor) => active\n      ? `${btnBase} background:${activeBg}; color:${activeColor}; border-color:${activeBg};`\n      : `${btnBase} background:var(--neutral-0); color:var(--neutral-500);`;\n\n    let evalGroups = [], evalCriticals = [];\n    if (rubric) {\n      evalGroups = rubric.groups.map(g => ({\n        title: g.title,\n        items: g.items.map(([code, label, weight]) => {\n          const id = code;\n          const status = s.evalStatuses[id];\n          return {\n            code, label, weight, section: g.section,\n            cumpleStyle: styleFor(status === 'cumple', 'var(--success-600)', 'var(--neutral-0)'),\n            noCumpleStyle: styleFor(status === 'no_cumple', 'var(--error-600)', 'var(--neutral-0)'),\n            naStyle: styleFor(status === 'na', 'var(--neutral-500)', 'var(--neutral-0)'),\n            setCumple: () => this.setEvalStatus(id, 'cumple'),\n            setNoCumple: () => this.setEvalStatus(id, 'no_cumple'),\n            setNA: () => this.setEvalStatus(id, 'na')\n          };\n        })\n      }));\n      evalCriticals = rubric.criticals.map(([id, label]) => ({\n        id, label, checked: !!s.evalCriticos[id],\n        toggle: () => this.toggleEvalCritical(id)\n      }));\n    }\n\n    const evalReport = s.lastReport ? {\n      ...s.lastReport,\n      finalColor: s.lastReport.critical ? 'var(--error-600)' : subFinalColor(s.lastReport.final)\n    } : null;\n\n    return {\n      navEvalStyle: `${navBase} background:${isEval ? 'var(--brand-500)' : 'transparent'}; color:${isEval ? 'var(--neutral-1000)' : 'var(--neutral-700)'};`,\n      navResultStyle: `${navBase} background:${isResult ? 'var(--brand-500)' : 'transparent'}; color:${isResult ? 'var(--neutral-1000)' : 'var(--neutral-700)'};`,\n      lockIconStyle: `display:${s.resultsUnlocked ? 'none' : 'inline-block'};`,\n      goEvaluacion: () => this.setState({ activeSection: 'evaluacion' }),\n      goResultados: () => this.setState({ activeSection: 'resultados' }),\n      evaluacionViewStyle: `display:${isEval ? 'block' : 'none'};`,\n      resultadosViewStyle: `display:${isResult ? 'block' : 'none'};`,\n      gateStyle: `display:${s.resultsUnlocked ? 'none' : 'block'};`,\n      unlockedStyle: `display:${s.resultsUnlocked ? 'block' : 'none'};`,\n      pwInput: s.pwInput,\n      handlePwInput: (e) => this.setState({ pwInput: e.target.value, pwError: false }),\n      handlePwKeyDown: (e) => { if (e.key === 'Enter') this.checkPassword(); },\n      pwErrorStyle: `display:${s.pwError ? 'block' : 'none'}; color:var(--error-600); font-size:12px; margin-bottom:10px;`,\n      submitPassword: () => this.checkPassword(),\n      subTotal: subs.length, subAvgFinal, subCriticalCount, subAvgDesvLabel, subDesvSubtitle,\n      subEmptyStyle, subContentStyle, subRows, filteredSubRows,\n      verticalsPresent, matrixVertical: activeVertical,\n      handleMatrixVertical: (e) => this.setState({ matrixVertical: e.target.value }),\n      matrixSubtitle,\n      matrixNoExpertStyle: `display:${!matrixExpert && subs.length > 0 ? 'block' : 'none'}; background:var(--neutral-50); border:1px solid var(--neutral-200); color:var(--neutral-600); border-radius:10px; padding:12px 14px; font-size:12.5px; margin-bottom:14px;`,\n      matrixEmptyVerticalStyle: `display:${matrixParticipants.length === 0 ? 'block' : 'none'}; color:var(--neutral-500); font-size:13px; padding:20px 0;`,\n      matrixTableStyle: `display:${matrixParticipants.length > 0 ? 'block' : 'none'};`,\n      matrixParticipants, matrixColumnCount: matrixParticipants.length + 1, matrixRows, matrixCriticalRows,\n      matrixExpertColStyle: `display:${matrixExpert ? 'flex' : 'none'}; text-align:center; color:var(--brand-700); font-weight:700; padding-bottom:4px; writing-mode:vertical-rl; transform:rotate(180deg); height:70px; align-items:center; justify-content:center;`,\n      matrixExpertLabel: matrixExpert ? matrixExpert.nombre + ' (experto)' : '',\n      matrixCardStyle, matrixFullscreenLabel, toggleMatrixFullscreen,\n      scatterPoints, gridLines, avgLineX,\n      barByCargo, cargoFilterClearStyle, clearCargoFilter,\n      summaryVerdict, summaryAlertsList, summaryAlertsStyle: `display:${summaryAlertsList.length ? 'block' : 'none'};`,\n      summaryAttrIssuesList: summaryAttrIssues, summaryFindingsStyle: `display:${summaryAttrIssues.length ? 'block' : 'none'};`,\n      summaryWorstList: summaryWorst.filter(w=>w.desv>0), summaryWorstStyle: `display:${expert && summaryWorst.filter(w=>w.desv>0).length ? 'block' : 'none'};`,\n      summaryRecommendationsList, summaryRecStyle: `display:${summaryRecommendationsList.length ? 'block' : 'none'};`,\n      downloadPDF: () => this.exportPDF(), downloadPNG: () => this.exportPNG(), downloadCSV: () => this.exportCSV(),\n      filterFecha: s.filterFecha, filterTicket: s.filterTicket,\n      handleFilterFecha: (e) => this.setState({ filterFecha: e.target.value }),\n      handleFilterTicket: (e) => this.setState({ filterTicket: e.target.value }),\n      clearTableFilters: () => this.setState({ filterFecha: '', filterTicket: '', cargoFilter: null }),\n      summaryGateStyle: `display:${s.summaryUnlocked ? 'none' : 'block'};`,\n      summaryContentStyle: `display:${s.summaryUnlocked ? 'block' : 'none'};`,\n      summaryPwInput: s.summaryPwInput,\n      handleSummaryPwInput: (e) => this.setState({ summaryPwInput: e.target.value, summaryPwError: false }),\n      handleSummaryPwKeyDown: (e) => { if (e.key === 'Enter') this.checkSummaryPassword(); },\n      submitSummaryPassword: () => this.checkSummaryPassword(),\n      summaryPwErrorStyle: `display:${s.summaryPwError ? 'block' : 'none'}; color:var(--error-600); font-size:12px; margin-top:8px;`,\n      evalForm: ef,\n      handleEvalField: {\n        nombre: (e) => this.setState({ evalForm: { ...ef, nombre: e.target.value.toUpperCase() } }),\n        cargo: (e) => this.setState({ evalForm: { ...ef, cargo: e.target.value } }),\n        oficina: (e) => this.setState({ evalForm: { ...ef, oficina: e.target.value } }),\n        fecha: (e) => this.setState({ evalForm: { ...ef, fecha: e.target.value } }),\n        chatId: (e) => this.setState({ evalForm: { ...ef, chatId: e.target.value } }),\n        chatLink: (e) => this.setState({ evalForm: { ...ef, chatLink: e.target.value } })\n      },\n      handleEvalVertical: (e) => this.setState({ evalForm: { ...ef, vertical: e.target.value } }),\n      evalPendingMessage: 'Esta vertical aún no tiene la rúbrica definida. Por favor, proporciona los criterios a evaluar o selecciona ATI o PAGOS para proceder.',\n      pendingNoticeStyle: `background:var(--warning-100); border:1px solid var(--warning-300); color:var(--warning-800); border-radius:10px; padding:14px 16px; font-size:13px; display:${showPendingNotice ? 'block' : 'none'};`,\n      evalHasRubricStyle: `display:${evalHasRubric ? 'block' : 'none'};`,\n      evalGroups, evalCriticals,\n      attemptSubmit: () => this.attemptSubmit(),\n      evalErrorStyle: `display:${s.evalError ? 'block' : 'none'}; color:var(--error-600); font-size:12.5px; font-weight:600; margin-top:10px;`,\n      evalReport: evalReport || { ticketId:'', nombre:'', cargo:'', oficina:'', fecha:'', vertical:'', comm:0, proc:0, final:0, critical:false, finalColor:'var(--neutral-500)' },\n      evalReportStyle: `margin-top:22px; background:var(--neutral-50); border:1px solid var(--neutral-200); border-radius:14px; padding:22px 24px; display:${evalReport ? 'block' : 'none'};`,\n      evalReportCriticalStyle: `background:var(--error-100); border:1px solid var(--error-300); color:var(--error-700); border-radius:10px; padding:12px 14px; font-size:13px; font-weight:600; margin-bottom:12px; display:${evalReport && evalReport.critical ? 'block' : 'none'};`\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
